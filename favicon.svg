<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="oceanGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#031726"/>
    </radialGradient>
    <linearGradient id="auvYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="sonarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background disc -->
  <circle cx="64" cy="64" r="60" fill="url(#oceanGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Sonar rings -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- Hydro-Vacuum intake cone (cyan glow) -->
  <path d="M 64 64 L 88 44 L 88 84 Z" fill="#38bdf8" fill-opacity="0.25" filter="url(#sonarGlow)"/>

  <!-- AUV Submarine Hull -->
  <ellipse cx="58" cy="64" rx="28" ry="12" fill="url(#auvYellow)"/>
  <!-- Nose cone -->
  <path d="M 86 64 C 86 57 82 54 74 53 L 74 75 C 82 74 86 71 86 64 Z" fill="#facc15"/>
  <!-- Cockpit dome / sensor camera -->
  <ellipse cx="68" cy="60" rx="7" ry="4.5" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Thrusters & fins -->
  <rect x="28" y="58" width="6" height="12" rx="2" fill="#475569"/>
  <path d="M 34 56 L 42 64 L 34 72 Z" fill="#64748b"/>
  <!-- Upper stabilizer fin -->
  <path d="M 44 52 L 40 43 L 48 43 Z" fill="#ca8a04"/>
  <!-- Headlight beam -->
  <polygon points="86,62 114,50 114,78 86,66" fill="#67e8f9" fill-opacity="0.4"/>
</svg>

